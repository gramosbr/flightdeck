[package]
name = "flightdeck-cli"
description = "The one `flightdeck` binary: the space apps, the show view, the palette popup and the hub as its subcommands, what keeps them running in their spaces, and what the plugin's scripts call (the actions space, notifications and their clicks and buttons, the browser beside a pane, screenshots, updates, the doctor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flightdeck"
path = "src/main.rs"

[dependencies]
flightdeck-core.workspace = true
flightdeck-update.workspace = true
flightdeck-hub = { path = "../hub" }
flightdeck-agents = { path = "../agents" }
flightdeck-inbox = { path = "../inbox" }
flightdeck-meetings = { path = "../meetings" }
flightdeck-mail = { path = "../mail" }
flightdeck-monitor = { path = "../monitor" }
flightdeck-palette = { path = "../palette" }
flightdeck-routines = { path = "../routines" }
flightdeck-review = { path = "../review" }
flightdeck-runbook = { path = "../runbook" }
flightdeck-show = { path = "../show" }
flightdeck-todo = { path = "../todo" }
flightdeck-connectors = { path = "../connectors" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
notify.workspace = true
regex.workspace = true
signal-hook = "0.3.18"
toml_edit = "0.25"
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tempfile = "3"
regex.workspace = true
